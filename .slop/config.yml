schema: 1
detector:
  name: jscpd
  version: "4.2.5"
defaults:
  format: go
  mode: mild
  min_lines: 5
  min_tokens: 40
global_ignore:
  - "**/vendor/**"
  - "**/*.bin"
  - "**/*.hfbc/**"
  - "**/bin/**"
scopes:
  go_production:
    scan_path: .
    pattern: "**/*.go"
    ignore:
      - "**/*_test.go"
      - "experiments/**"
      - "benchmarks/**"
  go_experiments:
    scan_path: experiments
    pattern: "**/*.go"
    ignore:
      - "**/*_test.go"
  go_benchmarks:
    scan_path: benchmarks
    pattern: "**/*.go"
    ignore:
      - "**/*_test.go"
  go_tests:
    scan_path: .
    pattern: "**/*_test.go"
    ignore:
      - "apps/**"
      - "examples/**"
      - "experiments/**"
      - "benchmarks/**"
  go_apps_tests:
    scan_path: apps
    pattern: "**/*_test.go"
    ignore: []
  go_examples_tests:
    scan_path: examples
    pattern: "**/*_test.go"
    ignore: []
  go_experiments_tests:
    scan_path: experiments
    pattern: "**/*_test.go"
    ignore: []
  go_benchmarks_tests:
    scan_path: benchmarks
    pattern: "**/*_test.go"
    ignore: []
