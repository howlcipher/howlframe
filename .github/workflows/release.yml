name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: tar.gz
          - goos: linux
            goarch: arm64
            ext: tar.gz
          - goos: darwin
            goarch: amd64
            ext: tar.gz
          - goos: darwin
            goarch: arm64
            ext: tar.gz
          - goos: windows
            goarch: amd64
            ext: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          BINARY_NAME=howlframe
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=howlframe.exe
          fi
          
          go build -ldflags="-w -s" -o $BINARY_NAME howlframe.go
          
          ARCHIVE_NAME=howlframe_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}
          if [ "${{ matrix.ext }}" = "zip" ]; then
            zip ${ARCHIVE_NAME}.zip $BINARY_NAME
          else
            tar -czf ${ARCHIVE_NAME}.tar.gz $BINARY_NAME
          fi
          
          # Generate checksum
          sha256sum ${ARCHIVE_NAME}.${{ matrix.ext }} > ${ARCHIVE_NAME}.${{ matrix.ext }}.sha256

      - name: Release Note Check
        run: |
          # The release notes should be present
          if [ -f "docs/releases/${GITHUB_REF#refs/tags/}.md" ]; then
            echo "Release notes found."
          else
            echo "Release notes not found, but continuing."
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip
            *.sha256
