name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Check format
      run: if [ -n "$(gofmt -l .)" ]; then echo "The following files are not formatted:"; gofmt -l .; exit 1; fi

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -v ./...

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run Benchmark v2 Harness Tests
      working-directory: benchmarks/v2/harness
      run: python3 -m unittest test_harness.py

